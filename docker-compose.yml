version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16-latest
    container_name: apix_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apix_secret}
      POSTGRES_DB: ${POSTGRES_DB:-apix_db}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/home/postgres/pgdata/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-apix} -d $${POSTGRES_DB:-apix_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apix_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@apix.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles:
      - tools  # only start with: docker-compose --profile tools up

volumes:
  timescale_data:
    driver: local
